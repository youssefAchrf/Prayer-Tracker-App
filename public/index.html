<html lang="en">
  <head>

    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- iOS PWA meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prayer Tracker" />

    <!-- Android PWA -->

    <!-- Favicon -->

    <title>Prayer Tracker</title>

    <!-- Optional: CSS (Expo or your own) -->

    <!-- Ensure full height layout for Expo/React Native Web -->
    <style id="expo-reset">
      html, body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      const theme = localStorage.getItem('theme') || 'light';
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) {
        metaTheme.setAttribute('content', theme === 'dark' ? '#121212' : '#f9fafb');
      }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('Service Worker registered successfully!');
            })
            .catch(err => {
              console.error('Service Worker registration failed:', err);
            });
        });
      }
    </script>

    <!-- Main JS -->
    <script src="/_expo/static/js/web/entry-3bac8f1b97b993d4ef9523ab89d3ade5.js" defer></script>
